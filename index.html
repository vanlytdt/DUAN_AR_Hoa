<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Phòng Thí Nghiệm Hóa Học AR</title>
    <!-- Thư viện A-Frame & MindAR -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }
        
        /* Màn hình chờ bắt đầu */
        #man-hinh-cho {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center;
            z-index: 10000; 
            color: #ffffff; 
            text-align: center; 
            padding: 20px; 
            box-sizing: border-box;
        }
        #btn-batdau {
            padding: 14px 32px; 
            font-size: 18px; 
            font-weight: bold;
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 30px;
            cursor: pointer; 
            margin-top: 20px; 
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
            transition: transform 0.2s;
        }
        #btn-batdau:active { transform: scale(0.95); }
        
        /* Bảng thông tin phản ứng */
        #bang-thong-tin {
            position: fixed; 
            bottom: 20px; 
            left: 50%; 
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
            border-radius: 16px; 
            padding: 16px 20px; 
            width: 90%; 
            max-width: 450px;
            color: white; 
            z-index: 9999; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            text-align: center; 
            transition: all 0.3s ease;
        }
        #ten-phan-ung { font-size: 16px; font-weight: bold; color: #38bdf8; margin-bottom: 5px; }
        #mo-ta { font-size: 13px; color: #cbd5e1; margin-bottom: 5px; line-height: 1.4; }
        #phuong-trinh { font-size: 14px; font-weight: 600; color: #facc15; font-family: monospace; }
    </style>
</head>
<body>

    <!-- Màn hình chờ bắt đầu -->
    <div id="man-hinh-cho">
        <h2>Phòng Thí Nghiệm Hóa Học AR</h2>
        <p>Hướng camera vào 2 thẻ hoá chất và ghép chúng lại gần nhau để xem phản ứng.</p>
        <button id="btn-batdau" onclick="batDau()">BẮT ĐẦU TRẢI NGHIỆM</button>
    </div>

    <!-- Bảng thông tin góc dưới màn hình -->
    <div id="bang-thong-tin">
        <div id="ten-phan-ung">Đang tìm thẻ...</div>
        <div id="mo-ta">Hãy hướng camera vào các thẻ hóa chất</div>
        <div id="phuong-trinh"></div>
    </div>

    <!-- Khung cảnh 3D & AR -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 4; autoStart: false; filterMinCF:0.001; filterBeta: 1000;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
        <a-light type="ambient" color="#ffffff" intensity="1"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.8" position="0 2 1"></a-light>

        <!-- ================= PHẢN ỨNG 1: Sodium (Na) + Water (H2O) ================= -->
        <!-- Target 0: Sodium -->
        <a-entity id="t-na" mindar-image-target="targetIndex: 0">
            <a-entity id="m-na" position="0 0 0.1">
                <a-sphere radius="0.2" material="color: #b0bec5; metalness: 0.9; roughness: 0.2" animation="property: rotation; to: 0 360 0; loop: true; dur: 4000; easing: linear"></a-sphere>
                <a-text value="Sodium (Na)" position="0 0.35 0" align="center" scale="0.5 0.5 0.5"></a-text>
            </a-entity>
            <!-- Hiệu ứng ngọn lửa và khói -->
            <a-entity id="fx-fire" visible="false" position="0 0 0.1">
                <a-sphere position="0 0.05 0" radius="0.1" material="color: #ffffff; shader: flat" animation="property: position; to: 0.1 0.08 0.08; dir: alternate; dur: 150; loop: true"></a-sphere>
                <a-cone position="0 0.3 0" rotation="90 0 0" radius-bottom="0.26" radius-top="0.01" height="0.65" material="color: #ea580c; shader: flat; opacity: 0.85; transparent: true; depthWrite: false" animation="property: scale; to: 1.3 1.5 1.3; dir: alternate; dur: 110; loop: true"></a-cone>
                <a-cone position="0 0.28 0" rotation="90 45 0" radius-bottom="0.18" radius-top="0.01" height="0.55" material="color: #facc15; shader: flat; opacity: 0.95; transparent: true; depthWrite: false" animation="property: scale; to: 1.4 1.4 1.4; dir: alternate; dur: 80; loop: true"></a-cone>
                <a-sphere position="0 0.65 0" radius="0.12" material="color: #ffffff; shader: flat; opacity: 0.8; transparent: true; depthWrite: false" animation="property: position; to: 0.05 1.3 0; dur: 700; loop: true" animation__sz="property: scale; to: 1.8 1.8 1.8; dur: 700; loop: true"></a-sphere>
                <a-text value="Na chay ruc ro!" position="0 1.6 0" align="center" scale="0.6 0.6 0.6" color="#facc15"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 1: Water -->
        <a-entity id="t-h2o" mindar-image-target="targetIndex: 1">
            <a-entity id="m-h2o" position="0 0 0.1" animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
                <a-sphere position="0 0 0" radius="0.14" color="#ef4444"></a-sphere>
                <a-sphere position="-0.12 0.1 0" radius="0.08" color="#ffffff"></a-sphere>
                <a-sphere position="0.12 0.1 0" radius="0.08" color="#ffffff"></a-sphere>
                <a-cylinder position="-0.06 0.05 0" rotation="0 0 -45" radius="0.02" height="0.15" color="#94a3b8"></a-cylinder>
                <a-cylinder position="0.06 0.05 0" rotation="0 0 45" radius="0.02" height="0.15" color="#94a3b8"></a-cylinder>
                <a-text value="Water (H2O)" position="0 0.35 0" align="center" scale="0.5 0.5 0.5"></a-text>
            </a-entity>
        </a-entity>

        <!-- ================= PHẢN ỨNG 2: Sodium hydroxide + Phenolphthalein ================= -->
        <!-- Target 2: Sodium hydroxide -->
        <a-entity id="t-naoh" mindar-image-target="targetIndex: 2">
            <a-entity id="m-naoh" position="0 0 0.1" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
                <a-sphere position="-0.1 0 0" radius="0.12" color="#0284c7"></a-sphere>
                <a-sphere position="0.1 0 0" radius="0.09" color="#ef4444"></a-sphere>
                <a-text value="Sodium hydroxide (NaOH)" position="0 0.3 0" align="center" scale="0.4 0.4 0.4"></a-text>
            </a-entity>
            <!-- Hiệu ứng đổi màu dung dịch -->
            <a-entity id="fx-pink" visible="false" position="0 0 0.1">
                <a-cylinder radius="0.25" height="0.5" rotation="90 0 0" material="color: #ec4899; opacity: 0.85; transparent: true" animation="property: scale; to: 1.1 1.1 1.1; dir: alternate; dur: 500; loop: true"></a-cylinder>
                <a-text value="Chuyen mau hong" position="0 0.9 0" align="center" scale="0.6 0.6 0.6" color="#f472b6"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 3: Phenolphthalein -->
        <a-entity id="t-ph" mindar-image-target="targetIndex: 3">
            <a-entity id="m-ph" position="0 0 0.1" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear">
                <a-torus radius="0.15" radius-tubular="0.02" color="#e2e8f0"></a-torus>
                <a-text value="Phenolphthalein" position="0 0.3 0" align="center" scale="0.4 0.4 0.4"></a-text>
            </a-entity>
        </a-entity>

        <!-- ================= PHẢN ỨNG 3: Lead(II) nitrate + Potassium iodide ================= -->
        <!-- Target 4: Lead(II) nitrate -->
        <a-entity id="t-pb" mindar-image-target="targetIndex: 4">
            <a-entity id="m-pb" position="0 0 0.1" animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
                <a-sphere radius="0.16" material="color: #64748b; metalness: 0.8"></a-sphere>
                <a-text value="Lead(II) nitrate" position="0 0.35 0" align="center" scale="0.45 0.45 0.45"></a-text>
            </a-entity>
            <!-- Hiệu ứng kết tủa lấp lánh (Mưa vàng) -->
            <a-entity id="fx-gold" visible="false" position="0 0 0.1">
                <a-cylinder position="0 0.25 0" radius="0.22" height="0.6" rotation="90 0 0" material="color: #fef08a; opacity: 0.3; transparent: true"></a-cylinder>
                <a-box position="-0.07 0.2 0.05" depth="0.04" height="0.04" width="0.04" material="color: #facc15; metalness: 0.9; roughness: 0.1" animation="property: position; to: -0.07 -0.2 0.05; dur: 900; loop: true" animation__r="property: rotation; to: 360 360 0; dur: 900; loop: true"></a-box>
                <a-box position="0.08 0.3 -0.05" depth="0.05" height="0.05" width="0.05" material="color: #eab308; metalness: 0.9; roughness: 0.1" animation="property: position; to: 0.08 -0.2 -0.05; dur: 1200; loop: true" animation__r="property: rotation; to: 0 360 360; dur: 1200; loop: true"></a-box>
                <a-box position="0 0.25 0" depth="0.03" height="0.03" width="0.03" material="color: #ca8a04; metalness: 0.9; roughness: 0.1" animation="property: position; to: 0 -0.2 0; dur: 700; loop: true" animation__r="property: rotation; to: 360 180 0; dur: 700; loop: true"></a-box>
                <a-text value="Ket tua PbI2 vang" position="0 1.05 0" align="center" scale="0.55 0.55 0.55" color="#facc15"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 5: Potassium iodide -->
        <a-entity id="t-ki" mindar-image-target="targetIndex: 5">
            <a-entity id="m-ki" position="0 0 0.1" animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
                <a-sphere position="-0.08 0 0" radius="0.1" color="#8b5cf6"></a-sphere>
                <a-sphere position="0.08 0 0" radius="0.14" color="#7e22ce"></a-sphere>
                <a-text value="Potassium iodide (KI)" position="0 0.3 0" align="center" scale="0.4 0.4 0.4"></a-text>
            </a-entity>
        </a-entity>

        <!-- ================= PHẢN ỨNG 4: Ammonium dichromate + Heat ================= -->
        <!-- Target 6: Ammonium dichromate -->
        <a-entity id="t-cr" mindar-image-target="targetIndex: 6">
            <a-entity id="m-cr" position="0 0 0.1">
                <a-cone position="0 0.1 0" rotation="90 0 0" radius-bottom="0.2" radius-top="0.01" height="0.2" material="color: #ea580c; roughness: 0.8"></a-cone>
                <a-text value="Ammonium dichromate" position="0 0.35 0" align="center" scale="0.4 0.4 0.4"></a-text>
            </a-entity>
            <!-- Hiệu ứng núi lửa phun trào -->
            <a-entity id="fx-volcano" visible="false" position="0 0 0.1">
                <a-cone position="0 0.2 0" rotation="90 0 0" radius-bottom="0.35" radius-top="0.05" height="0.4" material="color: #14532d; roughness: 0.9" animation="property: scale; to: 1.3 1.3 1.3; dur: 1000; loop: true; dir: alternate"></a-cone>
                <a-sphere position="0 0.4 0" radius="0.08" material="color: #f97316; shader: flat" animation="property: position; to: 0.05 0.8 0; dur: 400; loop: true"></a-sphere>
                <a-sphere position="-0.05 0.5 0" radius="0.06" material="color: #eab308; shader: flat" animation="property: position; to: -0.05 0.9 0; dur: 600; loop: true"></a-sphere>
                <a-text value="Nui lua hoa hoc (Cr2O3)" position="0 1.6 0" align="center" scale="0.5 0.5 0.5" color="#4ade80"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 7: Heat / Fire -->
        <a-entity id="t-fire" mindar-image-target="targetIndex: 7">
            <a-entity id="m-fire" position="0 0 0.1">
                <a-cylinder position="0 0.08 0" radius="0.015" height="0.25" material="color: #78350f"></a-cylinder>
                <a-cone position="0 0.25 0" rotation="90 0 0" radius-bottom="0.1" radius-top="0.01" height="0.3" material="color: #ef4444; shader: flat" animation="property: scale; to: 1.2 1.4 1.2; dir: alternate; dur: 150; loop: true"></a-cone>
                <a-text value="Nhiet do (t*)" position="0 0.45 0" align="center" scale="0.5 0.5 0.5"></a-text>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        const KHOANG_CACH_PHAN_UNG = 0.5; // Khoảng cách nhận diện va chạm (mét)

        const danhSachPhanUng = [
            {
                id: "1",
                t1: document.querySelector('#t-na'),
                t2: document.querySelector('#t-h2o'),
                m1: document.querySelector('#m-na'),
                m2: document.querySelector('#m-h2o'),
                fx: document.querySelector('#fx-fire'),
                title: "Phản ứng: Sodium + Nước",
                eq: "2Na + 2H₂O → 2NaOH + H₂↑",
                desc: "Natri nóng chảy vo tròn chạy trên mặt nước, toả nhiệt mạnh làm khí hydro bốc cháy với ngọn lửa vàng.",
                speech: "Natri phản ứng mãnh liệt với nước, tỏa nhiều nhiệt làm khí hydro bốc cháy với ngọn lửa màu vàng rực rỡ.",
                dangChay: false,
                coAmThanh: true
            },
            {
                id: "2",
                t1: document.querySelector('#t-naoh'),
                t2: document.querySelector('#t-ph'),
                m1: document.querySelector('#m-naoh'),
                m2: document.querySelector('#m-ph'),
                fx: document.querySelector('#fx-pink'),
                title: "Thí nghiệm: Nhận biết Bazơ",
                eq: "OH⁻ + HIn ⇌ In⁻ + H₂O",
                desc: "Dung dịch Sodium hydroxide (bazơ) làm dung dịch Phenolphthalein không màu chuyển sang màu hồng cánh sen.",
                speech: "Dung dịch Natri hiđroxit làm phenolphtalein không màu chuyển sang màu hồng cánh sen đặc trưng.",
                dangChay: false,
                coAmThanh: false
            },
            {
                id: "3",
                t1: document.querySelector('#t-pb'),
                t2: document.querySelector('#t-ki'),
                m1: document.querySelector('#m-pb'),
                m2: document.querySelector('#m-ki'),
                fx: document.querySelector('#fx-gold'),
                title: "Thí nghiệm: Mưa vàng",
                eq: "Pb(NO₃)₂ + 2KI → PbI₂↓ + 2KNO₃",
                desc: "Phản ứng trao đổi tạo thành kết tủa Lead(II) iodide màu vàng tươi lấp lánh như bụi vàng.",
                speech: "Phản ứng trao đổi giữa chì hai nitrat và kali iodua tạo ra kết tủa chì hai iodua màu vàng lấp lánh.",
                dangChay: false,
                coAmThanh: false
            },
            {
                id: "4",
                t1: document.querySelector('#t-cr'),
                t2: document.querySelector('#t-fire'),
                m1: document.querySelector('#m-cr'),
                m2: document.querySelector('#m-fire'),
                fx: document.querySelector('#fx-volcano'),
                title: "Thí nghiệm: Núi lửa Hóa học",
                eq: "(NH₄)₂Cr₂O₇ → Cr₂O₃ + N₂↑ + 4H₂O",
                desc: "Nhiệt phân Ammonium dichromate tự bốc cháy, giải phóng khí nitơ và tạo bọt xốp màu xanh lá cây đậm.",
                speech: "Nhiệt phân amoni dicromat giải phóng khí nitơ và tạo đụn tro crom ba oxit màu xanh lục giống như núi lửa phun trào.",
                dangChay: false,
                coAmThanh: true
            }
        ];

        let audioCtx = null;
        let amThanhNoise = null;
        let giongNoiChuan = null;

        function layGiongDoc() {
            if ('speechSynthesis' in window) {
                const voices = window.speechSynthesis.getVoices();
                giongNoiChuan = voices.find(v => v.lang.includes('vi') || v.lang.includes('VN')) || null;
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = layGiongDoc;
        }

        function batDau() {
            document.getElementById('man-hinh-cho').style.display = 'none';
            const sceneEl = document.querySelector('a-scene');
            const arSystem = sceneEl.systems['mindar-image-system'];
            if (arSystem) arSystem.start();

            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
            } catch(e) {}
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const initUtter = new SpeechSynthesisUtterance('');
                window.speechSynthesis.speak(initUtter);
                layGiongDoc();
            }
        }

        function batTiengLua() {
            if (amThanhNoise || !audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 2;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            amThanhNoise = audioCtx.createBufferSource();
            amThanhNoise.buffer = buffer;
            amThanhNoise.loop = true;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.value = 1000;

            amThanhNoise.connect(filter);
            filter.connect(audioCtx.destination);
            amThanhNoise.start();
        }

        function tatTiengLua() {
            if (amThanhNoise) {
                try { amThanhNoise.stop(); } catch(e){}
                amThanhNoise = null;
            }
        }

        function phatThuyetMinh(vanBan) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(vanBan);
                msg.lang = 'vi-VN';
                if (giongNoiChuan) msg.voice = giongNoiChuan;
                msg.rate = 0.95;
                window.speechSynthesis.speak(msg);
            }
        }

        const v1 = new THREE.Vector3();
        const v2 = new THREE.Vector3();

        function kiemTraVaCham() {
            let coPhanUngDangChay = false;

            nhomPhanUng.forEach(item => {
                const thayThe1 = item.t1.object3D && item.t1.object3D.visible;
                const thayThe2 = item.t2.object3D && item.t2.object3D.visible;

                if (thayThe1 && thayThe2) {
                    item.t1.object3D.getWorldPosition(v1);
                    item.t2.object3D.getWorldPosition(v2);

                    const khoangCach = v1.distanceTo(v2);

                    // Khi 2 thẻ ở gần nhau
                    if (khoangCach < KHOANG_CACH_PHAN_UNG && !item.dangChay) {
                        item.dangChay = true;
                        item.m1.setAttribute('visible', 'false');
                        item.m2.setAttribute('visible', 'false');
                        item.fx.setAttribute('visible', 'true');
                        
                        document.getElementById('ten-phan-ung').innerText = item.title;
                        document.getElementById('mo-ta').innerText = item.desc;
                        document.getElementById('phuong-trinh').innerText = item.eq;

                        if (item.coAmThanh) batTiengLua();
                        phatThuyetMinh(item.speech);
                    } 
                    // Khi 2 thẻ bị tách ra
                    else if (khoangCach >= KHOANG_CACH_PHAN_UNG + 0.25 && item.dangChay) {
                        item.dangChay = false;
                        item.m1.setAttribute('visible', 'true');
                        item.m2.setAttribute('visible', 'true');
                        item.fx.setAttribute('visible', 'false');
                        tatTiengLua();
                        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                        
                        document.getElementById('ten-phan-ung').innerText = "Đã tách 2 chất";
                        document.getElementById('mo-ta').innerText = "Đưa 2 thẻ lại gần nhau để kích hoạt phản ứng.";
                        document.getElementById('phuong-trinh').innerText = "";
                    }
                    if (item.dangChay) coPhanUngDangChay = true;
                } else if (item.dangChay && !thayThe1 && !thayThe2) {
                    item.dangChay = false;
                    item.m1.setAttribute('visible', 'true');
                    item.m2.setAttribute('visible', 'true');
                    item.fx.setAttribute('visible', 'false');
                    tatTiengLua();
                    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                }
            });

            if (!coPhanUngDangChay && document.getElementById('man-hinh-cho').style.display === 'none') {
                const timThayBatKyTheNao = nhomPhanUng.some(item => 
                    (item.t1.object3D && item.t1.object3D.visible) || (item.t2.object3D && item.t2.object3D.visible)
                );
                if (!timThayBatKyTheNao) {
                    document.getElementById('ten-phan-ung').innerText = "Đang tìm thẻ...";
                    document.getElementById('mo-ta').innerText = "Hãy đưa thẻ chất vào tầm nhìn của camera.";
                    document.getElementById('phuong-trinh').innerText = "";
                }
            }

            requestAnimationFrame(kiemTraVaCham);
        }

        // Bắt đầu vòng lặp
        kiemTraVaCham();
    </script>
</body>
</html>
