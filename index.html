<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hóa Học 3D - Nhận Diện Thẻ Bài</title>

    <!-- Thư viện A-Frame & MindAR phiên bản ổn định nhất -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        /* Màn hình chờ khởi động */
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
            text-align: center; padding: 20px;
        }
        #start-btn {
            margin-top: 25px; padding: 14px 36px; font-size: 17px; font-weight: bold;
            background: linear-gradient(135deg, #10b981, #059669); color: white;
            border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        #start-btn:active { transform: scale(0.96); }

        /* Bảng hiển thị trạng thái quét */
        #status-panel {
            position: fixed; top: 12px; left: 12px; right: 12px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
            color: #fff; padding: 10px 16px; font-size: 13px; z-index: 10000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%; display: inline-block;
            background: #eab308; margin-right: 6px;
        }
        #detected-list { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Màn hình cấp quyền Camera -->
    <div id="start-screen">
        <h2 style="color: #38bdf8; margin-bottom: 10px;">PHÒNG THÍ NGHIỆM AR</h2>
        <p style="color: #94a3b8; max-width: 320px; line-height: 1.5; font-size: 14px;">
            Hướng camera vào các thẻ bài hóa học để hiển thị mô hình và kích hoạt phản ứng 3D.
        </p>
        <button id="start-btn" onclick="startAR()">BẮT ĐẦU QUÉT</button>
    </div>

    <!-- Bảng thông báo trên màn hình -->
    <div id="status-panel">
        <div><span id="dot" class="status-dot"></span><span id="status-text">Đang chuẩn bị...</span></div>
        <div>Đang thấy: <span id="detected-list">Chưa có thẻ</span></div>
    </div>

    <!-- Khung cảnh AR A-Frame -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 8; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 5; autoStart: false;" 
        color-space="sRGB" 
        embedded 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- ================= TARGET 0: Sodium (Na) ================= -->
        <a-entity id="target-0" mindar-image-target="targetIndex: 0">
            <!-- Mặt phẳng nhận diện -->
            <a-plane position="0 0 0" height="1" width="1" material="color: #0284c7; opacity: 0.2; transparent: true"></a-plane>
            <!-- Mô hình 3D nguyên tử đại diện -->
            <a-sphere position="0 0 0.2" radius="0.18" color="#0284c7" metalness="0.8" roughness="0.2">
                <a-animation attribute="rotation" to="0 360 0" dur="4000" repeat="indefinite" easing="linear"></a-animation>
            </a-sphere>
            <a-text value="Na (Sodium)" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

        <!-- ================= TARGET 1: Water (H2O) ================= -->
        <a-entity id="target-1" mindar-image-target="targetIndex: 1">
            <a-plane position="0 0 0" height="1" width="1" material="color: #06b6d4; opacity: 0.2; transparent: true"></a-plane>
            <!-- Cụm phân tử H2O -->
            <a-entity position="0 0 0.2">
                <a-sphere position="0 0 0" radius="0.14" color="#ef4444"></a-sphere>
                <a-sphere position="-0.15 -0.1 0" radius="0.08" color="#f8fafc"></a-sphere>
                <a-sphere position="0.15 -0.1 0" radius="0.08" color="#f8fafc"></a-sphere>
            </a-entity>
            <a-text value="H2O (Water)" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

        <!-- ================= TARGET 2: NaOH ================= -->
        <a-entity id="target-2" mindar-image-target="targetIndex: 2">
            <a-plane position="0 0 0" height="1" width="1" material="color: #10b981; opacity: 0.2; transparent: true"></a-plane>
            <a-cylinder position="0 0 0.15" radius="0.15" height="0.3" color="#10b981" opacity="0.8"></a-cylinder>
            <a-text value="NaOH (Base)" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

        <!-- ================= TARGET 3: Phenolphthalein ================= -->
        <a-entity id="target-3" mindar-image-target="targetIndex: 3">
            <a-plane position="0 0 0" height="1" width="1" material="color: #db2777; opacity: 0.2; transparent: true"></a-plane>
            <a-octahedron position="0 0 0.2" radius="0.2" color="#db2777"></a-octahedron>
            <a-text value="Phenolphthalein" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

        <!-- ================= TARGET 4: Lead(II) Nitrate ================= -->
        <a-entity id="target-4" mindar-image-target="targetIndex: 4">
            <a-plane position="0 0 0" height="1" width="1" material="color: #64748b; opacity: 0.2; transparent: true"></a-plane>
            <a-box position="0 0 0.2" width="0.25" height="0.25" depth="0.25" color="#94a3b8"></a-box>
            <a-text value="Pb(NO3)2" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

        <!-- ================= TARGET 5: Potassium Iodide (KI) ================= -->
        <a-entity id="target-5" mindar-image-target="targetIndex: 5">
            <a-plane position="0 0 0" height="1" width="1" material="color: #eab308; opacity: 0.2; transparent: true"></a-plane>
            <a-dodecahedron position="0 0 0.2" radius="0.18" color="#eab308"></a-dodecahedron>
            <a-text value="KI (Potassium Iodide)" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

        <!-- ================= TARGET 6: Ammonium Dichromate ================= -->
        <a-entity id="target-6" mindar-image-target="targetIndex: 6">
            <a-plane position="0 0 0" height="1" width="1" material="color: #f97316; opacity: 0.2; transparent: true"></a-plane>
            <a-tetrahedron position="0 0 0.2" radius="0.22" color="#ea580c"></a-tetrahedron>
            <a-text value="(NH4)2Cr2O7" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

        <!-- ================= TARGET 7: Mồi lửa (Heat) ================= -->
        <a-entity id="target-7" mindar-image-target="targetIndex: 7">
            <a-plane position="0 0 0" height="1" width="1" material="color: #ef4444; opacity: 0.2; transparent: true"></a-plane>
            <a-cone position="0 0 0.2" radius-bottom="0.18" radius-top="0" height="0.35" color="#ef4444"></a-cone>
            <a-text value="Moi Lua (t*)" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const statusText = document.getElementById('status-text');
        const dot = document.getElementById('dot');
        const detectedList = document.getElementById('detected-list');

        const cardNames = [
            "Target 0 (Na)",
            "Target 1 (H2O)",
            "Target 2 (NaOH)",
            "Target 3 (Phenol)",
            "Target 4 (Pb(NO3)2)",
            "Target 5 (KI)",
            "Target 6 (Cr2O7)",
            "Target 7 (Mồi Lửa)"
        ];

        let activeTargets = new Set();

        function startAR() {
            document.getElementById('start-screen').style.display = 'none';
            statusText.innerText = "Đang tải targets.mind...";
            
            const arSystem = sceneEl.systems['mindar-image-system'];
            arSystem.start();
        }

        // Sự kiện khi nạp xong file targets.mind
        sceneEl.addEventListener("arReady", () => {
            statusText.innerText = "Camera sẵn sàng! Hãy soi thẻ.";
            dot.style.background = "#22c55e";
        });

        sceneEl.addEventListener("arError", (err) => {
            statusText.innerText = "Lỗi nạp file targets.mind!";
            dot.style.background = "#ef4444";
            console.error("Lỗi MindAR:", err);
        });

        // Đăng ký sự kiện phát hiện thẻ cho 8 Target
        for (let i = 0; i <= 7; i++) {
            const targetEl = document.querySelector(`#target-${i}`);
            if (targetEl) {
                targetEl.addEventListener("targetFound", () => {
                    activeTargets.add(cardNames[i]);
                    updateDetectedUI();
                });
                targetEl.addEventListener("targetLost", () => {
                    activeTargets.delete(cardNames[i]);
                    updateDetectedUI();
                });
            }
        }

        function updateDetectedUI() {
            if (activeTargets.size === 0) {
                detectedList.innerText = "Chưa có thẻ";
                detectedList.style.color = "#94a3b8";
            } else {
                detectedList.innerText = Array.from(activeTargets).join(", ");
                detectedList.style.color = "#38bdf8";
            }
        }
    </script>
</body>
</html>
