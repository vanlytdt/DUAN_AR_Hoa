<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hóa Học - Phản Ứng Khi Thẻ Gần Nhau</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .a-canvas {
            background: transparent !important;
            z-index: 2 !important;
            pointer-events: none;
        }
        video {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            object-fit: cover !important;
            z-index: 1 !important;
        }
        #hud {
            position: fixed;
            top: 12px; left: 12px; right: 12px;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            padding: 10px 14px;
            font-size: 13px;
            z-index: 99999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        #reaction-info {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            color: white;
            padding: 14px 24px;
            border-radius: 12px;
            z-index: 99999;
            text-align: center;
            display: none;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
            min-width: 280px;
        }
        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            background: #eab308;
        }
        .dot-green { background: #22c55e !important; }
    </style>
</head>
<body>

    <div id="hud">
        <div><span id="status-dot" class="dot"></span><span id="status-label">Đang bật camera...</span></div>
        <div>Đang thấy: <b id="target-label" style="color: #38bdf8;">Chưa có</b></div>
    </div>

    <div id="reaction-info">
        <h3 id="reaction-title" style="margin-bottom: 4px; font-size: 16px;">⚗️ PHẢN ỨNG HÓA HỌC!</h3>
        <p id="reaction-text" style="font-size: 13px; color: #cbd5e1;"></p>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 4; filterMinCF: 0.001; filterBeta: 100; missTolerance: 3;"
        embedded
        color-space="sRGB" 
        renderer="colorManagement: true; alpha: true; antialias: true;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-entity light="type: ambient; color: #ffffff; intensity: 1.5;"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 1.2; position: 1 2 1;"></a-entity>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- TARGET 0: Na -->
        <a-entity mindar-image-target="targetIndex: 0" id="card-0">
            <a-sphere position="0 0 0.2" radius="0.22" color="#0284c7" material="roughness: 0.3; metalness: 0.1"></a-sphere>
            <a-text value="Na (Sodium)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 1: H2O -->
        <a-entity mindar-image-target="targetIndex: 1" id="card-1">
            <a-sphere position="0 0 0.2" radius="0.16" color="#ef4444" material="roughness: 0.3"></a-sphere>
            <a-sphere position="-0.16 0.08 0.2" radius="0.09" color="#ffffff" material="roughness: 0.3"></a-sphere>
            <a-sphere position="0.16 0.08 0.2" radius="0.09" color="#ffffff" material="roughness: 0.3"></a-sphere>
            <a-text value="H2O (Water)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 2: NaOH -->
        <a-entity mindar-image-target="targetIndex: 2" id="card-2">
            <a-cylinder id="naoh-mesh" position="0 0 0.15" radius="0.16" height="0.3" color="#10b981" material="roughness: 0.3"></a-cylinder>
            <a-text value="NaOH" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 3: Phenolphthalein -->
        <a-entity mindar-image-target="targetIndex: 3" id="card-3">
            <a-octahedron position="0 0 0.2" radius="0.22" color="#db2777" material="roughness: 0.3"></a-octahedron>
            <a-text value="Phenol" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 4: Pb(NO3)2 -->
        <a-entity mindar-image-target="targetIndex: 4" id="card-4">
            <a-box position="0 0 0.2" width="0.26" height="0.26" depth="0.26" color="#94a3b8" material="roughness: 0.3"></a-box>
            <a-text value="Pb(NO3)2" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 5: KI -->
        <a-entity mindar-image-target="targetIndex: 5" id="card-5">
            <a-dodecahedron position="0 0 0.2" radius="0.2" color="#eab308" material="roughness: 0.3"></a-dodecahedron>
            <a-text value="KI" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 6: (NH4)2Cr2O7 -->
        <a-entity mindar-image-target="targetIndex: 6" id="card-6">
            <a-tetrahedron position="0 0 0.2" radius="0.24" color="#ea580c" material="roughness: 0.3"></a-tetrahedron>
            <a-text value="(NH4)2Cr2O7" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 7: Heat -->
        <a-entity mindar-image-target="targetIndex: 7" id="card-7">
            <a-cone position="0 0 0.2" radius-bottom="0.2" radius-top="0" height="0.38" color="#ef4444" material="roughness: 0.3"></a-cone>
            <a-text value="Heat (t*)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- Khu vực chứa hiệu ứng phản ứng -->
        <a-entity id="reaction-effects"></a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const statusLabel = document.getElementById('status-label');
        const statusDot = document.getElementById('status-dot');
        const targetLabel = document.getElementById('target-label');
        const reactionInfo = document.getElementById('reaction-info');
        const reactionTitle = document.getElementById('reaction-title');
        const reactionText = document.getElementById('reaction-text');

        const cardNames = ['Na', 'H2O', 'NaOH', 'Phenol', 'Pb(NO3)2', 'KI', '(NH4)2Cr2O7', 'Heat'];

        const reactions = {
            '0-1': {
                title: '2Na + 2H2O → 2NaOH + H2↑',
                desc: 'Natri tan nhanh, sủi bọt khí H2 và tỏa lượng nhiệt lớn!',
                color: '#ff6b35',
                type: 'explosion'
            },
            '2-3': {
                title: 'NaOH + Phenolphthalein → Màu Hồng',
                desc: 'Môi trường kiềm làm dung dịch phenolphthalein hóa hồng!',
                color: '#ec4899',
                type: 'pink'
            },
            '4-5': {
                title: 'Pb(NO3)2 + 2KI → PbI2↓ + 2KNO3',
                desc: 'Tạo kết tủa chì(II) iodua màu vàng lấp lánh (Mưa vàng)!',
                color: '#eab308',
                type: 'gold_rain'
            },
            '6-7': {
                title: '(NH4)2Cr2O7 → Cr2O3 + N2↑ + 4H2O',
                desc: 'Nhiệt phân muối đicromat tạo tàn tro xanh và tia lửa như núi lửa!',
                color: '#f97316',
                type: 'volcano'
            }
        };

        let visibleCards = new Set();
        let currentReactionKey = null;

        scene.addEventListener("arReady", () => {
            statusLabel.innerText = "Camera sẵn sàng!";
            statusDot.classList.add("dot-green");
        });

        scene.addEventListener("arError", (e) => {
            statusLabel.innerText = "Lỗi nạp camera/targets!";
            console.error(e);
        });

        for (let i = 0; i < 8; i++) {
            const el = document.querySelector(`#card-${i}`);
            if (el) {
                el.addEventListener("targetFound", () => {
                    visibleCards.add(i);
                    updateHUD();
                });
                el.addEventListener("targetLost", () => {
                    visibleCards.delete(i);
                    updateHUD();
                });
            }
        }

        function updateHUD() {
            if (visibleCards.size === 0) {
                targetLabel.innerText = "Chưa có";
                targetLabel.style.color = "#94a3b8";
            } else {
                const names = Array.from(visibleCards).map(id => cardNames[id]);
                targetLabel.innerText = names.join(" + ");
                targetLabel.style.color = "#38bdf8";
            }
        }

        // Tọa độ thực tế thế giới (World Position)
        const v1 = new THREE.Vector3();
        const v2 = new THREE.Vector3();

        // Kiểm tra khoảng cách liên tục mỗi khung hình render
        scene.addEventListener('renderloop', () => {
            if (visibleCards.size < 2) {
                if (currentReactionKey) stopReaction();
                return;
            }

            const activeList = Array.from(visibleCards);
            let foundReaction = false;

            for (let i = 0; i < activeList.length; i++) {
                for (let j = i + 1; j < activeList.length; j++) {
                    const id1 = activeList[i];
                    const id2 = activeList[j];

                    const pairKey = id1 < id2 ? `${id1}-${id2}` : `${id2}-${id1}`;
                    const reactionData = reactions[pairKey];

                    if (reactionData) {
                        const el1 = document.querySelector(`#card-${id1}`);
                        const el2 = document.querySelector(`#card-${id2}`);

                        if (el1 && el2 && el1.object3D && el2.object3D) {
                            el1.object3D.getWorldPosition(v1);
                            el2.object3D.getWorldPosition(v2);

                            const distance = v1.distanceTo(v2);

                            // Ngưỡng phát hiện va chạm: dưới 1.2 mét trong không gian AR
                            if (distance < 1.2) {
                                foundReaction = true;
                                if (currentReactionKey !== pairKey) {
                                    triggerReaction(pairKey, reactionData, v1, v2);
                                }
                                return;
                            }
                        }
                    }
                }
            }

            if (!foundReaction && currentReactionKey) {
                stopReaction();
            }
        });

        function triggerReaction(key, data, pos1, pos2) {
            currentReactionKey = key;
            reactionInfo.style.display = "block";
            reactionInfo.style.borderColor = data.color;
            reactionTitle.innerText = "⚗️ " + data.title;
            reactionText.innerText = data.desc;

            const mid = new THREE.Vector3().addVectors(pos1, pos2).multiplyScalar(0.5);
            playEffect(data.type, mid);
        }

        function stopReaction() {
            currentReactionKey = null;
            reactionInfo.style.display = "none";
            const fxContainer = document.getElementById('reaction-effects');
            while (fxContainer.firstChild) {
                fxContainer.removeChild(fxContainer.firstChild);
            }
            // Khôi phục màu gốc nếu là NaOH
            const naoh = document.getElementById('naoh-mesh');
            if (naoh) naoh.setAttribute('color', '#10b981');
        }

        function playEffect(type, pos) {
            const fxContainer = document.getElementById('reaction-effects');
            fxContainer.innerHTML = '';

            if (type === 'explosion') {
                // Hiệu ứng tia sáng bùng nổ cho Na + H2O
                for (let i = 0; i < 16; i++) {
                    const spark = document.createElement('a-sphere');
                    spark.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
                    spark.setAttribute('radius', '0.04');
                    spark.setAttribute('color', '#ff4500');
                    
                    const dx = (Math.random() - 0.5) * 0.8;
                    const dy = Math.random() * 0.8;
                    const dz = (Math.random() - 0.5) * 0.8;

                    spark.setAttribute('animation', `
                        property: position;
                        to: ${pos.x + dx} ${pos.y + dy} ${pos.z + dz};
                        dur: 800;
                        easing: easeOutQuad;
                        loop: true;
                    `);
                    fxContainer.appendChild(spark);
                }
            } else if (type === 'pink') {
                // Đổi NaOH sang màu hồng
                const naoh = document.getElementById('naoh-mesh');
                if (naoh) naoh.setAttribute('color', '#ec4899');
            } else if (type === 'gold_rain') {
                // Hạt kết tủa vàng rơi
                for (let i = 0; i < 14; i++) {
                    const drop = document.createElement('a-sphere');
                    drop.setAttribute('position', `${pos.x + (Math.random() - 0.5) * 0.4} ${pos.y + 0.3} ${pos.z + (Math.random() - 0.5) * 0.4}`);
                    drop.setAttribute('radius', '0.025');
                    drop.setAttribute('color', '#ffd700');
                    drop.setAttribute('animation', `
                        property: position;
                        to: ${pos.x + (Math.random() - 0.5) * 0.4} ${pos.y - 0.3} ${pos.z + (Math.random() - 0.5) * 0.4};
                        dur: ${1000 + Math.random() * 800};
                        easing: easeInQuad;
                        loop: true;
                    `);
                    fxContainer.appendChild(drop);
                }
            } else if (type === 'volcano') {
                // Phun trào núi lửa Cr2O7 + Heat
                for (let i = 0; i < 20; i++) {
                    const ash = document.createElement('a-sphere');
                    ash.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
                    ash.setAttribute('radius', '0.035');
                    ash.setAttribute('color', '#15803d'); // màu xanh Cr2O3
                    
                    const angle = Math.random() * Math.PI * 2;
                    const h = 0.5 + Math.random() * 0.4;
                    const spread = 0.3;

                    ash.setAttribute('animation', `
                        property: position;
                        to: ${pos.x + Math.cos(angle) * spread} ${pos.y + h} ${pos.z + Math.sin(angle) * spread};
                        dur: 1200;
                        easing: easeOutCubic;
                        loop: true;
                    `);
                    fxContainer.appendChild(ash);
                }
            }
        }
    </script>
</body>
</html>
