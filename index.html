<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hóa Học 3D - Nhận Diện Thẻ Bài</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            z-index: 99999; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
            text-align: center; padding: 20px;
        }
        #start-btn {
            margin-top: 25px; padding: 14px 36px; font-size: 17px; font-weight: bold;
            background: linear-gradient(135deg, #10b981, #059669); color: white;
            border: none; border-radius: 30px; cursor: pointer;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        #status-panel {
            position: fixed; top: 12px; left: 12px; right: 12px;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px;
            color: #fff; padding: 10px 16px; font-size: 13px; z-index: 10000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%; display: inline-block;
            background: #eab308; margin-right: 6px;
        }
    </style>
</head>
<body>
    <div id="start-screen">
        <h2 style="color: #38bdf8; margin-bottom: 10px;">PHÒNG THÍ NGHIỆM AR</h2>
        <p style="color: #94a3b8; max-width: 320px; line-height: 1.5; font-size: 14px;">
            Hướng camera vào các thẻ bài hóa học để hiển thị mô hình 3D.
        </p>
        <button id="start-btn" onclick="startAR()">BẮT ĐẦU QUÉT</button>
    </div>

    <div id="status-panel">
        <div><span id="dot" class="status-dot"></span><span id="status-text">Đang chuẩn bị...</span></div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 4; filterMinCF: 0.0001; filterBeta: 0.001; missTolerance: 10; warmupTolerance: 5; autoStart: false;" 
        color-space="sRGB" 
        embedded 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- TARGET 0: Sodium -->
        <a-entity mindar-image-target="targetIndex: 0">
            <a-sphere position="0 0 0.2" radius="0.18" color="#0284c7" metalness="0.8" roughness="0.2"></a-sphere>
            <a-text value="Na (Sodium)" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

        <!-- TARGET 1: Water -->
        <a-entity mindar-image-target="targetIndex: 1">
            <a-entity position="0 0 0.2">
                <a-sphere position="0 0 0" radius="0.14" color="#ef4444"></a-sphere>
                <a-sphere position="-0.15 -0.1 0" radius="0.08" color="#f8fafc"></a-sphere>
                <a-sphere position="0.15 -0.1 0" radius="0.08" color="#f8fafc"></a-sphere>
            </a-entity>
            <a-text value="H2O (Water)" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

        <!-- TARGET 2: NaOH -->
        <a-entity mindar-image-target="targetIndex: 2">
            <a-cylinder position="0 0 0.15" radius="0.15" height="0.3" color="#10b981" opacity="0.8"></a-cylinder>
            <a-text value="NaOH (Base)" align="center" position="0 0.65 0.1" color="#ffffff" width="3" font="roboto"></a-text>
        </a-entity>

        <!-- TARGET 3-7 tương tự... -->
        <!-- Thêm các target còn lại ở đây -->
        
    </a-scene>

    <script>
        const sceneEl = document.querySelector('a-scene');
        const statusText = document.getElementById('status-text');
        const dot = document.getElementById('dot');

        function startAR() {
            document.getElementById('start-screen').style.display = 'none';
            statusText.innerText = "Đang khởi tạo camera...";
            
            const arSystem = sceneEl.systems['mindar-image-system'];
            if (arSystem) {
                arSystem.start();
            } else {
                statusText.innerText = "Lỗi: Không tìm thấy MindAR system";
                console.error("MindAR system không tồn tại");
            }
        }

        sceneEl.addEventListener("arReady", () => {
            statusText.innerText = "Camera sẵn sàng! Hãy soi thẻ.";
            dot.style.background = "#22c55e";
            console.log("AR Ready");
        });

        sceneEl.addEventListener("arError", (err) => {
            statusText.innerText = "Lỗi nạp file targets.mind!";
            dot.style.background = "#ef4444";
            console.error("Lỗi MindAR:", err);
        });

        // Theo dõi các target
        for (let i = 0; i < 8; i++) {
            const targetEl = document.querySelector(`[mindar-image-target="targetIndex: ${i}"]`);
            if (targetEl) {
                targetEl.addEventListener("targetFound", () => {
                    console.log(`Target ${i} found!`);
                    statusText.innerText = `Đã phát hiện thẻ ${i}!`;
                });
                targetEl.addEventListener("targetLost", () => {
                    console.log(`Target ${i} lost`);
                    statusText.innerText = "Đang tìm kiếm thẻ...";
                });
            }
        }
    </script>
</body>
</html>
