<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hóa Học 3D</title>

    <!-- Nạp thư viện chuẩn -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: transparent;
        }

        /* Bảng điều khiển góc trên màn hình */
        #hud {
            position: fixed;
            top: 12px;
            left: 12px;
            right: 12px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            padding: 10px 14px;
            font-size: 13px;
            z-index: 9999;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            background: #eab308;
        }
        .dot-green { background: #22c55e !important; }
        .dot-red { background: #ef4444 !important; }

        /* Đảm bảo khung video camera hiển thị đúng vị trí */
        .mindar-ui-overlay {
            z-index: 100;
        }
    </style>
</head>
<body>

    <!-- Thanh trạng thái -->
    <div id="hud">
        <div><span id="status-dot" class="dot"></span><span id="status-label">Đang nạp dữ liệu targets.mind...</span></div>
        <div>Thẻ: <b id="target-label" style="color: #38bdf8;">Chưa có</b></div>
    </div>

    <!-- Khung cảnh AR A-Frame -->
    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 8; filterMinCF: 0.0001; filterBeta: 0.01; missTolerance: 8;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights: true" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Target 0: Sodium (Na) -->
        <a-entity id="target-0" mindar-image-target="targetIndex: 0">
            <a-entity id="content-0" visible="false">
                <a-sphere position="0 0 0.2" radius="0.22" color="#0284c7" metalness="0.8" roughness="0.2"></a-sphere>
                <a-text value="Na (Sodium)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 1: Water (H2O) -->
        <a-entity id="target-1" mindar-image-target="targetIndex: 1">
            <a-entity id="content-1" visible="false">
                <a-sphere position="0 0 0.2" radius="0.16" color="#ef4444"></a-sphere>
                <a-sphere position="-0.16 0.08 0.2" radius="0.09" color="#ffffff"></a-sphere>
                <a-sphere position="0.16 0.08 0.2" radius="0.09" color="#ffffff"></a-sphere>
                <a-text value="H2O (Water)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 2: NaOH -->
        <a-entity id="target-2" mindar-image-target="targetIndex: 2">
            <a-entity id="content-2" visible="false">
                <a-cylinder position="0 0 0.15" radius="0.16" height="0.3" color="#10b981"></a-cylinder>
                <a-text value="NaOH (Base)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 3: Phenolphthalein -->
        <a-entity id="target-3" mindar-image-target="targetIndex: 3">
            <a-entity id="content-3" visible="false">
                <a-octahedron position="0 0 0.2" radius="0.22" color="#db2777"></a-octahedron>
                <a-text value="Phenolphthalein" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 4: Pb(NO3)2 -->
        <a-entity id="target-4" mindar-image-target="targetIndex: 4">
            <a-entity id="content-4" visible="false">
                <a-box position="0 0 0.2" width="0.26" height="0.26" depth="0.26" color="#94a3b8"></a-box>
                <a-text value="Pb(NO3)2" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 5: KI -->
        <a-entity id="target-5" mindar-image-target="targetIndex: 5">
            <a-entity id="content-5" visible="false">
                <a-dodecahedron position="0 0 0.2" radius="0.2" color="#eab308"></a-dodecahedron>
                <a-text value="KI (Potassium Iodide)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 6: (NH4)2Cr2O7 -->
        <a-entity id="target-6" mindar-image-target="targetIndex: 6">
            <a-entity id="content-6" visible="false">
                <a-tetrahedron position="0 0 0.2" radius="0.24" color="#ea580c"></a-tetrahedron>
                <a-text value="(NH4)2Cr2O7" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
            </a-entity>
        </a-entity>

        <!-- Target 7: Mồi lửa (Heat) -->
        <a-entity id="target-7" mindar-image-target="targetIndex: 7">
            <a-entity id="content-7" visible="false">
                <a-cone position="0 0 0.2" radius-bottom="0.2" radius-top="0" height="0.38" color="#ef4444"></a-cone>
                <a-text value="Moi Lua (Heat)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
            </a-entity>
        </a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const statusLabel = document.getElementById('status-label');
        const statusDot = document.getElementById('status-dot');
        const targetLabel = document.getElementById('target-label');

        const cardNames = [
            "Target 0 (Na)",
            "Target 1 (H2O)",
            "Target 2 (NaOH)",
            "Target 3 (Phenol)",
            "Target 4 (Pb(NO3)2)",
            "Target 5 (KI)",
            "Target 6 (Cr2O7)",
            "Target 7 (Mồi Lửa)"
        ];

        let visibleCards = new Set();

        // Lắng nghe khi hệ thống MindAR nạp xong
        scene.addEventListener("arReady", () => {
            statusLabel.innerText = "Camera sẵn sàng! Hãy soi thẻ.";
            statusDot.classList.add("dot-green");
        });

        scene.addEventListener("arError", (e) => {
            statusLabel.innerText = "Lỗi nạp file targets.mind hoặc Camera!";
            statusDot.classList.add("dot-red");
            console.error("MindAR Error:", e);
        });

        // Đăng ký sự kiện riêng biệt cho từng thẻ
        for (let i = 0; i <= 7; i++) {
            const targetEl = document.querySelector(`#target-${i}`);
            const contentEl = document.querySelector(`#content-${i}`);

            if (targetEl && contentEl) {
                targetEl.addEventListener("targetFound", () => {
                    contentEl.setAttribute("visible", "true");
                    visibleCards.add(cardNames[i]);
                    updateUI();
                });

                targetEl.addEventListener("targetLost", () => {
                    contentEl.setAttribute("visible", "false");
                    visibleCards.delete(cardNames[i]);
                    updateUI();
                });
            }
        }

        function updateUI() {
            if (visibleCards.size === 0) {
                targetLabel.innerText = "Chưa có";
                targetLabel.style.color = "#94a3b8";
            } else {
                targetLabel.innerText = Array.from(visibleCards).join(", ");
                targetLabel.style.color = "#38bdf8";
            }
        }
    </script>
</body>
</html>
