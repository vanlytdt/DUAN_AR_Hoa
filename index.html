<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Hóa Học 3D - Phản Ứng Hóa Học</title>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: transparent !important;
            font-family: Arial, sans-serif;
        }
        .a-canvas {
            background: transparent !important;
            z-index: 2 !important;
            pointer-events: none;
        }
        video {
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            object-fit: cover !important;
            z-index: 1 !important;
        }
        #hud {
            position: fixed;
            top: 12px; left: 12px; right: 12px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #ffffff;
            padding: 10px 14px;
            font-size: 14px;
            z-index: 99999;
        }
        #reaction-info {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid #38bdf8;
            color: white;
            padding: 15px 20px;
            border-radius: 12px;
            z-index: 99999;
            text-align: center;
            display: none;
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.6);
            width: 90%;
            max-width: 400px;
        }
        #reaction-info h3 {
            color: #facc15;
            font-size: 16px;
            margin-bottom: 8px;
        }
        #reaction-info .desc {
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        #reaction-info .phenomenon {
            color: #cbd5e1;
            font-size: 12px;
            line-height: 1.4;
        }
        .dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            background: #eab308;
        }
        .dot-green { background: #22c55e !important; }
        #debug-info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #00ff00;
            padding: 8px;
            border-radius: 5px;
            font-size: 11px;
            z-index: 99998;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div><span id="status-dot" class="dot"></span><span id="status-label">Đang khởi động...</span></div>
        <div>Thẻ: <b id="target-label" style="color: #38bdf8;">Chưa có</b></div>
    </div>

    <div id="reaction-info">
        <h3 id="reaction-title">⚗️ PHẢN ỨNG HÓA HỌC!</h3>
        <p class="desc" id="reaction-desc"></p>
        <p class="phenomenon" id="reaction-phenomenon"></p>
    </div>

    <div id="debug-info">
        <div>Số thẻ: <span id="debug-count">0</span></div>
        <div>Khoảng cách: <span id="debug-distance">-</span></div>
    </div>

    <a-scene 
        mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 4; filterMinCF: 0.001; filterBeta: 0.5; missTolerance: 5; warmupTolerance: 5;"
        embedded
        color-space="sRGB" 
        renderer="colorManagement: true; alpha: true; antialias: true;" 
        vr-mode-ui="enabled: false" 
        device-orientation-permission-ui="enabled: false">
        
        <a-entity light="type: ambient; color: #ffffff; intensity: 1.6;"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 1.3; position: 1 3 1;"></a-entity>
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- TARGET 0: Na -->
        <a-entity mindar-image-target="targetIndex: 0" id="card-0">
            <a-sphere position="0 0 0.2" radius="0.22" color="#0284c7"></a-sphere>
            <a-text value="Na (Natri)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 1: H2O -->
        <a-entity mindar-image-target="targetIndex: 1" id="card-1">
            <a-sphere position="0 0 0.2" radius="0.16" color="#ef4444"></a-sphere>
            <a-sphere position="-0.16 0.08 0.2" radius="0.09" color="#ffffff"></a-sphere>
            <a-sphere position="0.16 0.08 0.2" radius="0.09" color="#ffffff"></a-sphere>
            <a-text value="H2O (Nước)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 2: NaOH -->
        <a-entity mindar-image-target="targetIndex: 2" id="card-2">
            <a-cylinder position="0 0 0.15" radius="0.16" height="0.3" color="#10b981"></a-cylinder>
            <a-text value="NaOH (Kiềm)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 3: Phenolphthalein -->
        <a-entity mindar-image-target="targetIndex: 3" id="card-3">
            <a-octahedron position="0 0 0.2" radius="0.22" color="#db2777"></a-octahedron>
            <a-text value="Phenolphtalein" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 4: Pb(NO3)2 -->
        <a-entity mindar-image-target="targetIndex: 4" id="card-4">
            <a-box position="0 0 0.2" width="0.26" height="0.26" depth="0.26" color="#94a3b8"></a-box>
            <a-text value="Pb(NO3)2 (Chì Nitrat)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 5: KI -->
        <a-entity mindar-image-target="targetIndex: 5" id="card-5">
            <a-dodecahedron position="0 0 0.2" radius="0.2" color="#eab308"></a-dodecahedron>
            <a-text value="KI (Kali Iodua)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 6: (NH4)2Cr2O7 -->
        <a-entity mindar-image-target="targetIndex: 6" id="card-6">
            <a-tetrahedron position="0 0 0.2" radius="0.24" color="#ea580c"></a-tetrahedron>
            <a-text value="(NH4)2Cr2O7" align="center" position="0 0.65 0.1" scale="0.7 0.7 0.7" color="#ffffff"></a-text>
        </a-entity>

        <!-- TARGET 7: Heat -->
        <a-entity mindar-image-target="targetIndex: 7" id="card-7">
            <a-cone position="0 0 0.2" radius-bottom="0.2" radius-top="0" height="0.38" color="#ef4444"></a-cone>
            <a-text value="Nhiệt (t°)" align="center" position="0 0.65 0.1" scale="0.8 0.8 0.8" color="#ffffff"></a-text>
        </a-entity>

        <!-- Container cho sản phẩm phản ứng -->
        <a-entity id="reaction-container"></a-entity>

    </a-scene>

    <script>
        const scene = document.querySelector('a-scene');
        const statusLabel = document.getElementById('status-label');
        const statusDot = document.getElementById('status-dot');
        const targetLabel = document.getElementById('target-label');
        const reactionInfo = document.getElementById('reaction-info');
        const reactionTitle = document.getElementById('reaction-title');
        const reactionDesc = document.getElementById('reaction-desc');
        const reactionPhenomenon = document.getElementById('reaction-phenomenon');
        const debugCount = document.getElementById('debug-count');
        const debugDistance = document.getElementById('debug-distance');

        const cardNames = ['Na', 'H2O', 'NaOH', 'Phenolphtalein', 'Pb(NO3)2', 'KI', '(NH4)2Cr2O7', 'Nhiệt'];

        // Dữ liệu phản ứng với mô tả tiếng Việt
        const reactions = {
            '0-1': {
                title: '⚗️ Natri + Nước',
                desc: 'Phương trình: 2Na + 2H₂O → 2NaOH + H₂↑',
                phenomenon: 'Hiện tượng: Natri nóng chảy thành giọt tròn chạy trên mặt nước, sủi bọt khí mạnh, tỏa nhiều nhiệt và bốc cháy với ngọn lửa màu vàng. Sản phẩm tạo thành là dung dịch Natri Hydroxit (NaOH) và khí Hydro (H₂).',
                color: '#ff6b35',
                type: 'na_h2o'
            },
            '2-3': {
                title: '⚗️ Kiềm + Chất chỉ thị',
                desc: 'Phương trình: NaOH + Phenolphtalein → Dung dịch hồng',
                phenomenon: 'Hiện tượng: Dung dịch Natri Hydroxit (NaOH) không màu khi gặp Phenolphtalein lập tức chuyển sang màu hồng cánh sen đặc trưng, chứng tỏ môi trường có tính kiềm mạnh (pH > 9).',
                color: '#ec4899',
                type: 'naoh_phenol'
            },
            '4-5': {
                title: '⚗️ Chì Nitrat + Kali Iodua',
                desc: 'Phương trình: Pb(NO₃)₂ + 2KI → PbI₂↓ + 2KNO₃',
                phenomenon: 'Hiện tượng: Xuất hiện kết tủa màu vàng tươi của Chì(II) Iodua (PbI₂) lấp lánh như những tinh thể vàng rơi xuống đáy. Đây là phản ứng trao đổi ion tạo kết tủa đặc trưng.',
                color: '#eab308',
                type: 'lead_iodide'
            },
            '6-7': {
                title: '⚗️ Amoni Đicromat + Nhiệt',
                desc: 'Phương trình: (NH₄)₂Cr₂O₇ → Cr₂O₃ + N₂↑ + 4H₂O',
                phenomenon: 'Hiện tượng: Muối Amoni Đicromat màu cam khi đun nóng bùng cháy, phun trào tàn tro xốp màu xanh thẫm của Crôm(III) Oxit (Cr₂O₃), kèm theo khí Nitơ và hơi nước. Giống như núi lửa phun trào mini.',
                color: '#f97316',
                type: 'volcano'
            }
        };

        // Hệ thống âm thanh
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let currentSoundNode = null;

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            stopSound();

            if (type === 'na_h2o') {
                // Tiếng xèo xèo
                const bufferSize = audioCtx.sampleRate * 2;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (audioCtx.sampleRate * 0.5));
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                noise.loop = true;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1400;
                noise.connect(filter);
                filter.connect(audioCtx.destination);
                noise.start();
                currentSoundNode = noise;
            } 
            else if (type === 'naoh_phenol') {
                // Tiếng chuông êm
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 1.2);
            }
            else if (type === 'lead_iodide') {
                // Tiếng kết tinh
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(659.25, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(329.63, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            }
            else if (type === 'volcano') {
                // Tiếng lửa gầm
                const bufferSize = audioCtx.sampleRate * 2.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                noise.loop = true;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 350;
                noise.connect(filter);
                filter.connect(audioCtx.destination);
                noise.start();
                currentSoundNode = noise;
            }
        }

        function stopSound() {
            if (currentSoundNode) {
                try { currentSoundNode.stop(); } catch(e){}
                currentSoundNode = null;
            }
        }

        // Theo dõi targets
        let visibleCards = new Set();
        let currentReactionKey = null;
        let checkInterval = null;

        scene.addEventListener("arReady", () => {
            statusLabel.innerText = "Camera sẵn sàng!";
            statusDot.classList.add("dot-green");
            
            // Bắt đầu kiểm tra phản ứng mỗi 500ms
            checkInterval = setInterval(checkReactions, 500);
        });

        scene.addEventListener("arError", (e) => {
            statusLabel.innerText = "Lỗi camera!";
            console.error("AR Error:", e);
        });

        // Đăng ký sự kiện cho từng thẻ
        for (let i = 0; i < 8; i++) {
            const cardEl = document.querySelector(`#card-${i}`);
            if (cardEl) {
                cardEl.addEventListener("targetFound", () => {
                    visibleCards.add(i);
                    updateHUD();
                    console.log(`Thẻ ${cardNames[i]} được phát hiện!`);
                });
                cardEl.addEventListener("targetLost", () => {
                    visibleCards.delete(i);
                    updateHUD();
                    console.log(`Thẻ ${cardNames[i]} bị mất!`);
                });
            }
        }

        function updateHUD() {
            debugCount.innerText = visibleCards.size;
            if (visibleCards.size === 0) {
                targetLabel.innerText = "Chưa có";
                targetLabel.style.color = "#94a3b8";
            } else {
                const names = Array.from(visibleCards).map(id => cardNames[id]);
                targetLabel.innerText = names.join(" + ");
                targetLabel.style.color = "#38bdf8";
            }
        }

        // Kiểm tra phản ứng giữa các thẻ
        function checkReactions() {
            if (visibleCards.size < 2) {
                if (currentReactionKey) stopReaction();
                return;
            }

            const activeList = Array.from(visibleCards);
            let foundReaction = false;
            let minDistance = Infinity;

            for (let i = 0; i < activeList.length; i++) {
                for (let j = i + 1; j < activeList.length; j++) {
                    const id1 = activeList[i];
                    const id2 = activeList[j];
                    const pairKey = id1 < id2 ? `${id1}-${id2}` : `${id2}-${id1}`;
                    const reactionData = reactions[pairKey];

                    if (reactionData) {
                        const el1 = document.querySelector(`#card-${id1}`);
                        const el2 = document.querySelector(`#card-${id2}`);

                        if (el1 && el2) {
                            // Lấy vị trí thực tế của các thẻ
                            const pos1 = el1.object3D.position;
                            const pos2 = el2.object3D.position;
                            
                            const distance = Math.sqrt(
                                Math.pow(pos1.x - pos2.x, 2) + 
                                Math.pow(pos1.y - pos2.y, 2) + 
                                Math.pow(pos1.z - pos2.z, 2)
                            );
                            
                            minDistance = Math.min(minDistance, distance);
                            
                            // Debug
                            if (activeList.length === 2) {
                                debugDistance.innerText = distance.toFixed(2) + 'm';
                            }
                            
                            // Khoảng cách kích hoạt (có thể điều chỉnh)
                            const activationDistance = 0.8;
                            
                            if (distance < activationDistance) {
                                foundReaction = true;
                                if (currentReactionKey !== pairKey) {
                                    triggerReaction(pairKey, reactionData, pos1, pos2);
                                }
                                return;
                            }
                        }
                    }
                }
            }

            if (!foundReaction && currentReactionKey) {
                stopReaction();
            }
        }

        function triggerReaction(key, data, pos1, pos2) {
            currentReactionKey = key;
            
            // Hiển thị thông tin phản ứng
            reactionInfo.style.display = "block";
            reactionInfo.style.borderColor = data.color;
            reactionTitle.innerText = data.title;
            reactionDesc.innerText = data.desc;
            reactionPhenomenon.innerText = data.phenomenon;
            
            // Phát âm thanh
            playSound(data.type);
            
            // Tính vị trí trung tâm
            const midX = (pos1.x + pos2.x) / 2;
            const midY = (pos1.y + pos2.y) / 2;
            const midZ = (pos1.z + pos2.z) / 2;
            
            // Tạo hiệu ứng 3D
            buildReactionProducts(data.type, midX, midY, midZ);
            
            console.log(`⚗️ Phản ứng xảy ra: ${data.title}`);
        }

        function stopReaction() {
            currentReactionKey = null;
            reactionInfo.style.display = "none";
            stopSound();
            
            // Xóa hiệu ứng
            const container = document.getElementById('reaction-container');
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }
        }

        // Tạo mô hình sản phẩm 3D
        function buildReactionProducts(type, x, y, z) {
            const container = document.getElementById('reaction-container');
            container.innerHTML = '';
            
            const root = document.createElement('a-entity');
            root.setAttribute('position', `${x} ${y} ${z}`);

            if (type === 'na_h2o') {
                // Sản phẩm NaOH
                const naohProduct = document.createElement('a-cylinder');
                naohProduct.setAttribute('radius', '0.25');
                naohProduct.setAttribute('height', '0.15');
                naohProduct.setAttribute('color', '#06b6d4');
                naohProduct.setAttribute('opacity', '0.8');
                root.appendChild(naohProduct);
                
                // Bọt khí H2
                for (let i = 0; i < 15; i++) {
                    const bubble = document.createElement('a-sphere');
                    const ox = (Math.random() - 0.5) * 0.3;
                    const oz = (Math.random() - 0.5) * 0.3;
                    bubble.setAttribute('position', `${ox} 0.1 ${oz}`);
                    bubble.setAttribute('radius', '0.04');
                    bubble.setAttribute('color', '#ffffff');
                    bubble.setAttribute('opacity', '0.85');
                    bubble.setAttribute('animation', `
                        property: position;
                        to: ${ox * 1.5} ${0.7 + Math.random() * 0.5} ${oz * 1.5};
                        dur: ${800 + Math.random() * 600};
                        easing: easeOutQuad;
                        loop: true;
                    `);
                    root.appendChild(bubble);
                }
                
                // Ngọn lửa
                const flame = document.createElement('a-cone');
                flame.setAttribute('position', '0 0.15 0');
                flame.setAttribute('radius-bottom', '0.12');
                flame.setAttribute('height', '0.35');
                flame.setAttribute('color', '#ff9900');
                flame.setAttribute('material', 'emissive: #ff5500; emissiveIntensity: 0.8');
                flame.setAttribute('animation', 'property: scale; to: 1.3 1.5 1.3; dur: 200; dir: alternate; loop: true');
                root.appendChild(flame);
                
                const label = document.createElement('a-text');
                label.setAttribute('value', 'NaOH + H₂↑');
                label.setAttribute('align', 'center');
                label.setAttribute('position', '0 0.8 0');
                label.setAttribute('scale', '0.9 0.9 0.9');
                label.setAttribute('color', '#ffedd5');
                root.appendChild(label);
            } 
            else if (type === 'naoh_phenol') {
                // Dung dịch hồng
                const pinkSolution = document.createElement('a-sphere');
                pinkSolution.setAttribute('radius', '0.32');
                pinkSolution.setAttribute('color', '#f43f5e');
                pinkSolution.setAttribute('opacity', '0.85');
                pinkSolution.setAttribute('animation', 'property: scale; from: 0.2 0.2 0.2; to: 1.1 1.1 1.1; dur: 1200; easing: easeOutElastic');
                root.appendChild(pinkSolution);
                
                const label = document.createElement('a-text');
                label.setAttribute('value', 'Màu hồng cánh sen');
                label.setAttribute('align', 'center');
                label.setAttribute('position', '0 0.6 0');
                label.setAttribute('scale', '0.9 0.9 0.9');
                label.setAttribute('color', '#ffffff');
                root.appendChild(label);
            }
            else if (type === 'lead_iodide') {
                // Kết tủa vàng
                const precipitate = document.createElement('a-cylinder');
                precipitate.setAttribute('position', '0 -0.15 0');
                precipitate.setAttribute('radius', '0.28');
                precipitate.setAttribute('height', '0.08');
                precipitate.setAttribute('color', '#eab308');
                root.appendChild(precipitate);
                
                // Tinh thể vàng rơi
                for (let i = 0; i < 20; i++) {
                    const crystal = document.createElement('a-octahedron');
                    const gx = (Math.random() - 0.5) * 0.45;
                    const gz = (Math.random() - 0.5) * 0.45;
                    crystal.setAttribute('position', `${gx} 0.5 ${gz}`);
                    crystal.setAttribute('radius', '0.035');
                    crystal.setAttribute('color', '#fde047');
                    crystal.setAttribute('material', 'metalness: 0.9; roughness: 0.1');
                    crystal.setAttribute('animation', `
                        property: position;
                        to: ${gx} -0.12 ${gz};
                        dur: ${900 + Math.random() * 800};
                        easing: easeInQuad;
                        loop: true;
                    `);
                    root.appendChild(crystal);
                }
                
                const label = document.createElement('a-text');
                label.setAttribute('value', 'Kết tủa PbI₂ (vàng)');
                label.setAttribute('align', 'center');
                label.setAttribute('position', '0 0.65 0');
                label.setAttribute('scale', '0.9 0.9 0.9');
                label.setAttribute('color', '#fef08a');
                root.appendChild(label);
            }
            else if (type === 'volcano') {
                // Tro núi lửa
                const ashPile = document.createElement('a-cone');
                ashPile.setAttribute('position', '0 -0.05 0');
                ashPile.setAttribute('radius-bottom', '0.35');
                ashPile.setAttribute('height', '0.25');
                ashPile.setAttribute('color', '#14532d');
                root.appendChild(ashPile);
                
                // Hạt tro bắn ra
                for (let i = 0; i < 25; i++) {
                    const particle = document.createElement('a-sphere');
                    particle.setAttribute('position', '0 0.1 0');
                    particle.setAttribute('radius', '0.035');
                    particle.setAttribute('color', Math.random() > 0.4 ? '#166534' : '#f97316');
                    
                    const angle = Math.random() * Math.PI * 2;
                    const spread = 0.35 + Math.random() * 0.3;
                    const height = 0.6 + Math.random() * 0.5;
                    
                    particle.setAttribute('animation', `
                        property: position;
                        to: ${Math.cos(angle) * spread} ${height} ${Math.sin(angle) * spread};
                        dur: ${1000 + Math.random() * 800};
                        easing: easeOutCubic;
                        loop: true;
                    `);
                    root.appendChild(particle);
                }
                
                const label = document.createElement('a-text');
                label.setAttribute('value', 'Cr₂O₃ + N₂↑');
                label.setAttribute('align', 'center');
                label.setAttribute('position', '0 0.85 0');
                label.setAttribute('scale', '0.9 0.9 0.9');
                label.setAttribute('color', '#86efac');
                root.appendChild(label);
            }
            
            container.appendChild(root);
        }

        // Đảm bảo canvas trong suốt
        scene.addEventListener('loaded', function() {
            const canvas = document.querySelector('.a-canvas');
            if (canvas) {
                canvas.style.background = 'transparent';
            }
            if (scene.renderer) {
                scene.renderer.setClearColor(0x000000, 0);
            }
        });
    </script>
</body>
</html>
